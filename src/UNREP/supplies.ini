; Gameplay defaults, not historical ship manifests or endurance figures.
; Use an [UNREP] section in a native vessel extension for per-unit tuning.
; Existing local catalogue sections such as [usn_lha_tarawa] still take precedence.
; Amounts and capacities = BaseKg + KgPerTonne * native displacement in tonnes.
[Reserves]
Water=True
Food=True
SpareParts=True
AviationFuel=True

[Propulsion]
StopWhenOutOfFuel=True

[ShipEstimates]
; Apply ship-type estimates when the corresponding global formula uses its default coefficients.
Enabled=True

[Defaults]
; Fuel use tracks engine orders.
FuelBaseKg=1000
FuelKgPerTonne=45
FuelCapacityBaseKg=2000
FuelCapacityKgPerTonne=90
AviationFuelBaseKg=0
AviationFuelKgPerTonne=4
AviationFuelCapacityBaseKg=0
AviationFuelCapacityKgPerTonne=8
FoodBaseKg=100
FoodKgPerTonne=3
FoodCapacityBaseKg=200
FoodCapacityKgPerTonne=6
WaterBaseKg=100
WaterKgPerTonne=3
WaterCapacityBaseKg=200
WaterCapacityKgPerTonne=6
SparePartsBaseKg=50
SparePartsKgPerTonne=1
SparePartsCapacityBaseKg=100
SparePartsCapacityKgPerTonne=2

; Rates = BaseKgPerHour + KgPerTonnePerHour * displacement in tonnes.
; Override any rate under a ship catalogue section, e.g. [usn_lha_tarawa].
; Zero both coefficients to disable a rate. All rates use simulation time.
[Consumption]
; FuelFull coefficients in an older configuration are accepted as aliases.
FuelStandardBaseKgPerHour=0
FuelStandardKgPerTonnePerHour=0.65
FoodUseBaseKgPerHour=0
FoodUseKgPerTonnePerHour=0.006
WaterProductionBaseKgPerHour=0
WaterProductionKgPerTonnePerHour=0.04
SparePartsUseBaseKgPerHour=0
SparePartsUseKgPerTonnePerHour=0.001
; Extra use per DC team actually repairing. Empty stock never blocks DC.
SparePartsPerDCTeamBaseKgPerHour=100
SparePartsPerDCTeamKgPerTonnePerHour=0

[FuelTelegraph]
AheadFlankPercent=300
AheadFullPercent=200
AheadStandardPercent=100
AheadTwoThirdsPercent=60
AheadOneThirdPercent=30
AllStopPercent=10
BackFullPercent=150

[Transfer]
RangeNm=0.2
MaxSpeedKnots=12
KgPerSecond=20
ItemsPerSecond=0.1
AmmoPointsPerSecond=1
UnrepSpeedKnots=8
StationNm=0.1
RendezvousNm=0.6
BreakawayNm=0.5
StationToleranceNm=0.03
HeadingToleranceDegrees=10
RelativeSpeedToleranceKnots=1

[Helicopter]
SlingCapacityKg=500
HoverToleranceNm=0.05
