; Gameplay defaults, not historical ship manifests or endurance figures.
; Add [usn_lha_tarawa] or another catalogue reference to override stock and capacity.
; Amounts and capacities = BaseKg + KgPerTonne * native displacement in tonnes.
[Defaults]
; Fuel use tracks engine orders. Empty reserves do not stop propulsion.
FuelBaseKg=1000
FuelKgPerTonne=20
FuelCapacityBaseKg=2000
FuelCapacityKgPerTonne=40
FoodBaseKg=100
FoodKgPerTonne=2
FoodCapacityBaseKg=200
FoodCapacityKgPerTonne=4
WaterBaseKg=100
WaterKgPerTonne=2
WaterCapacityBaseKg=200
WaterCapacityKgPerTonne=4
SparePartsBaseKg=50
SparePartsKgPerTonne=1
SparePartsCapacityBaseKg=100
SparePartsCapacityKgPerTonne=2

; Rates = BaseKgPerHour + KgPerTonnePerHour * displacement in tonnes.
; Override any rate under a ship catalogue section, e.g. [usn_lha_tarawa].
; Zero both coefficients to disable a rate. All rates use simulation time.
[Consumption]
; Full reverse and full ahead use 100%; flank uses 200%; interpolate between.
FuelFullBaseKgPerHour=0
FuelFullKgPerTonnePerHour=0.25
FoodUseBaseKgPerHour=0
FoodUseKgPerTonnePerHour=0.002
WaterProductionBaseKgPerHour=0
WaterProductionKgPerTonnePerHour=0.02
SparePartsUseBaseKgPerHour=0
SparePartsUseKgPerTonnePerHour=0.001
; Extra use per DC team actually repairing. Empty stock never blocks DC.
SparePartsPerDCTeamBaseKgPerHour=250
SparePartsPerDCTeamKgPerTonnePerHour=0

[Transfer]
RangeNm=0.2
MaxSpeedKnots=12
KgPerSecond=20
ItemsPerSecond=0.1
AmmoPointsPerSecond=1
UnrepSpeedKnots=8
StationNm=0.1
RendezvousNm=0.6
BreakawayNm=0.5
StationToleranceNm=0.03
HeadingToleranceDegrees=10
RelativeSpeedToleranceKnots=1

[Helicopter]
SlingCapacityKg=500
HoverToleranceNm=0.05
