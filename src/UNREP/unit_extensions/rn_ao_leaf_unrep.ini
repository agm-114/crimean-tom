#!extend vessels/rn_ao_leaf.ini

; Extra provisions and parts to distribute alongside the native replenishment cargo.

# Historical RFA, Brambleleaf (A81), 24–25 July 1982: loaded 4,541 metric tonnes
# of furnace fuel oil and 5,782 metric tonnes of diesel, plus a separate AVCAT load.
# https://www.historicalrfa.org/rfa-brambleleaf
# This documented surface-fuel load is a conservative proxy for the stock Leaf
# stand-in, whose variants represent tankers of several designs.
# Use the same loading's reported 4,524 tons of AVCAT as a separate cargo
# estimate, treating the figure as metric tonnes.
# Ship Design Data Book, section 4.4, lists 320 long tons of fresh water
# stowage and 800 long tons of water cargo. The model combines them and starts
# with full cargo and half the ship's own stowage, rounded to metric tonnes.
# https://pdfcoffee.com/ship-design-data-book-2011-pdf-pdf-free.html

[UNREP]
FoodMultiplier=2
FoodCapacityMultiplier=2
WaterMultiplier=2
WaterCapacityMultiplier=2
SparePartsMultiplier=2
SparePartsCapacityMultiplier=2
CargoFuelCapacityKg=10323000
AviationFuelCapacityKg=4524000
AviationFuelKg=4524000
WaterCapacityKg=1138000
WaterKg=975000
