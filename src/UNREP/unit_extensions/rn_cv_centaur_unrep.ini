#!extend vessels/rn_cv_centaur.ini

; Gameplay allowances for embarked air groups or troops.

# Ship Design Data Book (2011 compilation), sections 4.2.4 and 4.4.
# https://pdfcoffee.com/ship-design-data-book-2011-pdf-pdf-free.html
# Hermes (the stock Centaur hull represents Hermes): 1450 m3 AVCAT and 450 long tons fresh water stowage.
# AVCAT uses 800 kg/m3, consistent with the handbook's volume conversion.
# Water is rounded to the nearest tonne. Scenario tanks start half full.

[UNREP]
FoodMultiplier=1.5
FoodCapacityMultiplier=1.5
FoodUseMultiplier=1.5
WaterMultiplier=1.5
WaterCapacityMultiplier=1.5
WaterProductionMultiplier=1.5
SparePartsMultiplier=1.5
SparePartsCapacityMultiplier=1.5
SparePartsUseMultiplier=1.5
AviationFuelCapacityKg=1160000
AviationFuelKg=580000
WaterCapacityKg=457000
WaterKg=228500
