#!extend vessels/usn_ao_t2.ini

; Extra provisions and parts to distribute alongside the native replenishment cargo.

# MARAD, HAER VA-128, Saugatuck, pp. 4–5: 141,200 bbl tank volume and 16,613 long tons deadweight.
# https://www.maritime.dot.gov/sites/marad.dot.gov/files/docs/about-us/history/vessels-maritime-administration/996/saugatuckhaerreport.pdf
# Estimate the practical fuel payload as 90% of deadweight (~15.2 million kg).
# This uses the EIA tanker estimation convention and leaves weight for other loads.
# https://www.eia.gov/international/content/analysis/special_topics/SHIP_Act/SHIP-Act.pdf
# The HAER report lists two 35-ton drinking-water tanks and one 40-ton auxiliary tank.
# Converted as 110 long tons, rounded to the nearest 1,000 kg.

[UNREP]
FoodMultiplier=2
FoodCapacityMultiplier=2
WaterMultiplier=2
WaterCapacityMultiplier=2
SparePartsMultiplier=2
SparePartsCapacityMultiplier=2
CargoFuelCapacityKg=15200000
WaterCapacityKg=112000
WaterKg=112000
