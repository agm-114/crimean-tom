; Amphibs profile data, not native Sea Power unit definitions.
; Candidate profiles register separate playable variants; Conditional profiles are skipped.
; Section names reserve separate unit IDs; SourceUnit is never overwritten.
; Dimensions and mass come from the installed stock catalogue.
; WaterSpeedKnots values are initial calm-water tuning, not certified limits.
; Candidate = suitable vehicle family; Conditional = verify equipment/version first.
; WaterlineOffsetMeters shifts the model origin relative to sea level, negative sinks it.
; Offsets are initial visual tuning, not measured drafts. WakeScale=0 disables effects.
; WeaponsAfloat defaults to False. WaterRole and Propulsion are descriptive only.

