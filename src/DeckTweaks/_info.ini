[Language_en]
Name=[CT] Deck Tweaks
Description=Preparation time depends on how much fuel, gun ammunition, chaff, and other stores crews need to add or remove for each aircraft.\n\nChange a flight's loadout while it prepares. Swapping stores already aboard can add time. Use + and - beside the aircraft count to add or remove aircraft during preparation. Select Cancel Abort to resume preparation with the fuel and stores still aboard.\n\nHover over the loadout or ETA to see each aircraft's fuel quantity, refueling rate, current and target store counts, time per unit (/u), and when crews will finish loading or unloading each store. Click the caret beside the ETA to show those details below the loadout dropdown.\n\nOptions > Gameplay > Deck Tweaks controls refueling, mounting and removal times, plus aircraft and operator multipliers. Sea Power's Flight Deck Timings setting applies.\n\nRequires [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3380210757]AnchorChain[/url] or Keel.\n\nRequires [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3839698527]Controls & Settings[/url] (0.3.0 or newer).

