Name=[CT] Deck Tweaks
Description=Aircraft preparation time is calculated per aircraft from how much fuel, gun ammunition, chaff, and other stores need to be added or removed. A batch is ready when all aircraft in it are prepared.\n\nFlight Operations shows the selected loadout, current activity, assigned crews, and batch ETA. The State tooltip shows fuel quantity, refueling rate, current and target store counts, time per unit (/u), and when each store will finish loading or unloading. The Loadout menu previews the work required to switch to a different loadout.\n\nAircraft retain unused internal fuel and mounted stores after normal recovery. Preparation uses recovered aircraft from the same squadron first. Tactical saves retain preparation progress and hangar state.\n\nrearm-times.ini defines refueling, mounting, and removal times and aircraft and operator multipliers. Sea Power's Flight Deck Timings setting applies.\n\nRequires [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3380210757]AnchorChain[/url] and its preloader. Tested on Sea Power 0.9.0-261111.

