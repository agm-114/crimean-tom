Name=[CT] Deck Tweaks
Description=Aircraft preparation time is calculated per aircraft from how much fuel, gun ammunition, chaff, and other stores need to be added or removed. A batch is ready when all aircraft in it are prepared.\n\nFlight Operations shows the selected loadout, current activity, assigned crews, and batch ETA roughly as before. Hovering over the loadouts or the time shows fuel quantity, refueling rate, current and target store counts, time per unit (/u), and when each store will finish loading or unloading.\n\nOptions > Gameplay > Deck Tweaks controls refueling, mounting and removal times, plus aircraft and operator multipliers. Sea Power's Flight Deck Timings setting applies.\n\nRequires [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3380210757]AnchorChain[/url] and its preloader. Tested on Sea Power 0.9.1-261112.

