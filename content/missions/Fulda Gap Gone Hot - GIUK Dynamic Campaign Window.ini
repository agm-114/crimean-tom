Taskforce1StartMessage=CRIMEAN TOM // DYNAMIC CAMPAIGN TACTICAL WINDOW|CAMPAIGN: FULDA GAP GONE HOT — GLOBAL WAR\nREGION: GIUK BARRIER\nAUTHORITY: SEA POWER / TACTICAL\n\nUSS Pharris and USS Honolulu have been promoted as one local interaction island after operational detection reports placed a Soviet Victor III and Oscar I barrier inside the engagement envelope.\n\nThe wider campaign remains active: Argentina is supporting Soviet logistics in the South Atlantic; the Levant, Gulf, India-Pakistan front, South China Sea, Japan, and North Pacific are contested. Sea Power owns only this local window. Checkpoints are reconciled into the canonical campaign when the island is safely demoted.|Assume tactical control

