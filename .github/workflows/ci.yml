name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-campaign:
    name: Build DLLs and campaign tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Build campaign monitor
        run: pnpm monitor:build

      - name: Restore and build game-independent DLLs
        run: |
          dotnet restore CrimeanTom.CI.slnf
          dotnet build CrimeanTom.CI.slnf --configuration Release --no-restore --verbosity minimal

      - name: Run campaign kernel integration tests
        run: pnpm test:campaign

  protocol:
    name: Protocol integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Build campaign monitor
        run: pnpm monitor:build

      - name: Run protocol integration tests
        run: pnpm test:protocol
